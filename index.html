<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora - Next-Gen Human-like Hindi TTS</title>
    <style>
        /* ಕಣ್ಣಿಗೆ ತಂಪು ನೀಡುವ ಡಾರ್ಕ್ ಥೀಮ್ ಮತ್ತು ಪ್ರೀಮಿಯಂ ಲುಕ್ */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .wrapper {
            width: 90%;
            max-width: 700px;
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .tagline {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 12px;
            color: #fff;
            padding: 15px;
            font-size: 1.1rem;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .engine-status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #ea580c;
            font-weight: bold;
        }
        .action-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: 0.3s;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>VELORA</h1>
    <div class="tagline">Next-Level Human-like Hindi Text-to-Speech Engine</div>
    
    <textarea id="hindiInputField" placeholder="यहाँ हिंदी में लिखिए... (e.g., भाइयों और बहनों, आज का दिन बहुत विशेष है...)"></textarea>
    
    <div class="engine-status" id="engineStatus">Velora Engine: Ready to Analyze...</div>
    
    <button class="action-btn" onclick="startVeloraEngine()">Analyze & Speak</button>
</div>

<script>
    // ವೆಬ್‌ಸೈಟ್ ಕೆಲಸ ಮಾಡುವ ಆರಂಭಿಕ ಲಾಜಿಕ್
    function startVeloraEngine() {
        let inputText = document.getElementById('hindiInputField').value.trim();
        
        if (inputText === "") {
            alert("Please enter some Hindi text first!");
            return;
        }
        
        // ಸ್ಟೇಟಸ್ ಬದಲಾಯಿಸುವುದು
        document.getElementById('engineStatus').style.color = "#38bdf8";
        document.getElementById('engineStatus').innerText = "Velora Brain: Analyzing text emotions & pauses...";
        
        // ಮುಂದಿನ ಹಂತದಲ್ಲಿ ಇಲ್ಲಿಗೆ ನಮ್ಮ 'ಸ್ಮಾಲ್ AI API' ಮತ್ತು 'ಸೌಂಡ್ ಬ್ಯಾಂಕ್' ಲಿಂಕ್ ಆಗುತ್ತದೆ.
        console.log("Analyzing text: " + inputText);
    }
</script>

</body>
</html>
